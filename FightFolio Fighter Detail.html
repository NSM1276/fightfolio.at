<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FightFolio.at — Fighter Profile</title>
<link rel="stylesheet" href="colors_and_type.css">
<style>
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { background: var(--background); min-height: 100vh; padding-bottom: 96px; }
  a { color: inherit; }
  button:focus-visible, a:focus-visible, input:focus-visible {
    outline: 2px solid var(--accent); outline-offset: 2px;
  }
  ::selection { background: var(--accent); color: var(--text-on-accent); }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: var(--background); }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 999px; }

  .ak-detail-grid {
    display: grid;
    grid-template-columns: 1fr 340px;
    gap: 48px;
    align-items: start;
  }
  .ak-detail-aside {
    position: sticky;
    top: 110px;
    display: flex; flex-direction: column; gap: 16px;
  }
  @media (max-width: 900px) {
    .ak-detail-grid { grid-template-columns: 1fr; gap: 24px; }
    .ak-detail-aside { position: static; top: auto; }
    .ak-gallery { height: 280px !important; grid-template-columns: 2fr 1fr !important; grid-template-rows: 1fr 1fr !important; }
    .ak-gallery > button:nth-child(n+4) { display: none !important; }
    .ak-nav-desktop { display: none !important; }
  }

  .ak-section { padding: 36px 0; border-top: 1px solid var(--border); }
  .ak-section:first-of-type { border-top: none; padding-top: 24px; }
  .ak-section-h {
    font-size: 22px; font-weight: 700; letter-spacing: -0.01em;
    margin: 0 0 18px;
  }

  .ak-anchor-nav {
    position: sticky; top: 60px; z-index: 10;
    background: rgba(13,13,20,0.90);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
  }
  .ak-anchor-nav-inner {
    max-width: 1200px; margin: 0 auto; padding: 0 24px;
    display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none;
  }
  .ak-anchor-nav-inner::-webkit-scrollbar { display: none; }
  .ak-anchor-nav a {
    padding: 14px 14px; white-space: nowrap;
    color: var(--text-secondary); text-decoration: none;
    font-size: 13px; font-weight: 600;
    border-bottom: 2px solid transparent;
    transition: color 150ms, border-color 150ms;
  }
  .ak-anchor-nav a:hover { color: var(--text-primary); }
  .ak-anchor-nav a.active { color: var(--accent); border-bottom-color: var(--accent); }
</style>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel" src="src/data.jsx"></script>
<script type="text/babel" src="src/atoms.jsx"></script>
<script type="text/babel" src="src/Header.jsx"></script>
<script type="text/babel" src="src/detail-data.jsx"></script>
<script type="text/babel" src="src/Gallery.jsx"></script>
<script type="text/babel" src="src/detail-sections.jsx"></script>

<script type="text/babel" data-presets="env,react">
const { useState, useEffect } = React;

// Fighter selector — runs after detail-data.jsx is loaded by Babel
(function () {
  var params = new URLSearchParams(window.location.search);
  var urlId = params.get('id');
  var parts = window.location.hostname.split('.');
  var isSubdomain = parts.length >= 3 && parts[0] !== 'www'
    && !window.location.hostname.endsWith('.vercel.app')
    && window.location.hostname !== 'localhost';
  var subId = isSubdomain ? parts[0] : null;
  var id = urlId || subId || 'aleksandar-rakic';

  // Try full detail entry first, then fall back to FIGHTERS card data
  var v = window.VENUES[id];
  if (!v) {
    var f = (window.FIGHTERS || []).find(function(x) { return x.id === id; });
    if (f) {
      v = {
        id: f.id,
        name: f.name,
        tagline_de: f.weightClass + ' · ' + f.city + ', ' + f.country,
        tagline_en: f.weightClass + ' · ' + f.city + ', ' + f.country,
        city: f.city,
        country: f.country,
        status: f.status,
        styles: f.styles || [],
        weightClass: f.weightClass,
        record: f.record,
        rating: f.rating || 4.0,
        reviews: f.reviews || 0,
        tags: f.tags || [],
        gallery: [
          { hue: f.accentHue,        a: f.img[0], b: f.img[1] },
          { hue: (f.accentHue + 15) % 360, a: f.img[0], b: f.img[1] },
          { hue: (f.accentHue + 30) % 360, a: f.img[0], b: f.img[1] },
          { hue: (f.accentHue + 45) % 360, a: f.img[0], b: f.img[1] },
          { hue: (f.accentHue + 60) % 360, a: f.img[0], b: f.img[1] },
        ],
        nextFight: {
          opponent_de: 'TBD', opponent_en: 'TBD',
          date_de: '2026', date_en: '2026',
          event: 'TBD', location: 'TBD',
        },
        fightHistory: [],
        stats: {
          age: '—', height: '—', reach: '—', stance: '—',
          nationality: f.country,
          gym: '—',
          born: f.city + ', ' + f.country,
        },
        reviews_list: [],
        career_log: [],
        similar: [],
        sponsors: f.sponsors || [],
      };
    } else {
      v = window.VENUES['aleksandar-rakic'];
    }
  }
  window.VENUE = v;
  document.title = v.name + ' — FightFolio.at';
})();

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "defaultLang": "de"
}/*EDITMODE-END*/;

function Detail() {
  const [lang, setLang] = useState(() => localStorage.getItem('fightfolio.lang') || TWEAK_DEFAULTS.defaultLang || 'de');
  const v = window.VENUE;
  const c = window.DETAIL_COPY[lang];

  useEffect(() => { localStorage.setItem('fightfolio.lang', lang); }, [lang]);
  useEffect(() => { document.documentElement.lang = lang; }, [lang]);

  const [active, setActive] = useState('overview');

  const sections = [
    ['overview',     c.sections.info],
    ['nextfight',    c.sections.nextFight],
    ['history',      c.sections.fightHistory],
    ['stats',        c.sections.stats],
    ['career',       c.sections.career],
    ['similar',      c.sections.similar],
  ];

  // Record breakdown
  const rp = (v.record || '0-0-0').split('-');
  const wins = parseInt(rp[0]) || 0;
  const losses = parseInt(rp[1]) || 0;

  return (
    <>
      <window.Header lang={lang} setLang={setLang} />

      {/* Anchor nav */}
      <div className="ak-anchor-nav">
        <div className="ak-anchor-nav-inner">
          {sections.map(([id, label]) => (
            <a key={id} href={`#${id}`} className={active === id ? 'active' : ''}
               onClick={() => setActive(id)}>
              {label}
            </a>
          ))}
        </div>
      </div>

      <main style={{ maxWidth: 1200, margin: '0 auto', padding: '24px 24px 0' }}>
        {/* Breadcrumb */}
        <nav style={{ fontSize: 12, color: 'var(--text-tertiary)', marginBottom: 16, display: 'flex', gap: 6, alignItems: 'center' }}>
          {['Home', lang === 'de' ? 'Kämpfer' : 'Fighters', v.name].map((b, i) => {
            const href = i === 0 ? 'FightFolio Homepage.html' : i === 1 ? 'FightFolio Homepage.html' : '#';
            return (
              <React.Fragment key={i}>
                {i > 0 && <span style={{ color: 'var(--text-tertiary)' }}>›</span>}
                <a href={href} style={{
                  color: i === 2 ? 'var(--text-primary)' : 'var(--text-tertiary)',
                  textDecoration: 'none', fontWeight: i === 2 ? 600 : 400,
                }}>{b}</a>
              </React.Fragment>
            );
          })}
        </nav>

        {/* Title block */}
        <div style={{ display: 'flex', alignItems: 'flex-start', justifyContent: 'space-between', gap: 24, flexWrap: 'wrap', marginBottom: 20 }}>
          <div style={{ flex: 1, minWidth: 280 }}>
            <div style={{ display: 'flex', alignItems: 'center', gap: 10, marginBottom: 10, flexWrap: 'wrap' }}>
              <window.StatusBadge status={v.status} lang={lang} />
              {/* Record pill */}
              <span style={{
                padding: '4px 12px',
                background: 'rgba(30,30,48,0.6)',
                border: '1px solid var(--border)',
                borderRadius: 999,
                fontSize: 13, fontWeight: 800,
                display: 'inline-flex', alignItems: 'center', gap: 5,
              }}>
                <span style={{ color: 'var(--win)' }}>{wins}W</span>
                <span style={{ color: 'var(--text-tertiary)', fontWeight: 400 }}>·</span>
                <span style={{ color: 'var(--loss)' }}>{losses}L</span>
              </span>
              {/* Weight class */}
              <span style={{
                display: 'inline-flex', alignItems: 'center', gap: 5,
                padding: '4px 12px',
                background: 'rgba(212,175,55,0.08)',
                border: '1px solid rgba(212,175,55,0.25)',
                borderRadius: 999,
                fontSize: 12, fontWeight: 600, color: 'var(--accent)',
              }}>
                <window.Icon.weight size={11} />
                {v.weightClass}
              </span>
            </div>
            <h1 style={{
              margin: 0, fontSize: 'clamp(32px, 4.5vw, 52px)', fontWeight: 800,
              letterSpacing: '-0.03em', lineHeight: 1.0,
            }}>{v.name}</h1>
            <p style={{ margin: '10px 0 0', fontSize: 16, color: 'var(--text-secondary)', maxWidth: 560, lineHeight: 1.5 }}>
              {lang === 'de' ? v.tagline_de : v.tagline_en}
            </p>
            <div style={{ marginTop: 14, display: 'flex', flexWrap: 'wrap', gap: 6 }}>
              {v.tags.map((t) => (
                <span key={t} style={{
                  padding: '4px 10px', borderRadius: 999,
                  background: 'rgba(30,30,48,0.5)', border: '1px solid var(--border)',
                  fontSize: 12, color: 'var(--text-secondary)', fontWeight: 500,
                }}>{t}</span>
              ))}
            </div>

            {/* Sponsors */}
            {(v.sponsors && v.sponsors.length > 0) && (
              <div style={{ marginTop: 16, display: 'flex', flexWrap: 'wrap', gap: 8, alignItems: 'center', paddingTop: 12, borderTop: '1px solid var(--border)' }}>
                <span style={{ fontSize: 11, color: 'var(--text-tertiary)', fontWeight: 700, textTransform: 'uppercase', letterSpacing: '0.04em' }}>
                  🤝 {lang === 'de' ? 'Sponsoren' : 'Sponsors'}:
                </span>
                {v.sponsors.map((sponsor, idx) => (
                  <span key={idx} style={{
                    display: 'inline-block',
                    padding: '5px 12px',
                    background: 'rgba(237, 104, 31, 0.1)',
                    border: '1px solid rgba(237, 104, 31, 0.25)',
                    borderRadius: 6,
                    fontSize: 12,
                    color: 'var(--accent)',
                    fontWeight: 600,
                    whiteSpace: 'nowrap',
                  }}>{sponsor.name}</span>
                ))}
              </div>
            )}
          </div>

          <div style={{ display: 'flex', gap: 8, flexShrink: 0 }}>
            <button style={btnStyle('accent')}>
              <window.Icon.trophy size={14} />
              {lang === 'de' ? 'Folgen' : 'Follow'}
            </button>
            <button style={btnStyle('ghost')}>
              ↗ {lang === 'de' ? 'Teilen' : 'Share'}
            </button>
          </div>
        </div>

        {/* Gallery */}
        <window.Gallery venue={v} lang={lang} />

        {/* Two-col grid */}
        <div className="ak-detail-grid" style={{ marginTop: 32 }}>
          <div>
            <section id="overview" className="ak-section">
              <h2 className="ak-section-h">{c.sections.info}</h2>
              <p style={{ margin: '0 0 20px', fontSize: 15, color: 'var(--text-secondary)', lineHeight: 1.65, maxWidth: 640 }}>
                {lang === 'de' ? v.tagline_de : v.tagline_en}
                {v.stats?.gym
                  ? ` ${lang === 'de' ? '— trainiert bei' : '— trains at'} ${v.stats.gym}.`
                  : ''}
              </p>
              <h3 style={{ margin: '0 0 10px', fontSize: 12, fontWeight: 700, letterSpacing: '0.08em', textTransform: 'uppercase', color: 'var(--text-tertiary)' }}>
                {c.sections.stats}
              </h3>
              <window.FighterStats venue={v} lang={lang} />
            </section>

            <section id="nextfight" className="ak-section">
              <h2 className="ak-section-h">{c.sections.nextFight}</h2>
              <window.NextFight venue={v} lang={lang} />
            </section>

            <section id="history" className="ak-section">
              <h2 className="ak-section-h">{c.sections.fightHistory}</h2>
              <window.FightHistory venue={v} lang={lang} />
            </section>

            <section id="stats" className="ak-section">
              <h2 className="ak-section-h">{c.sections.reviews}</h2>
              <window.Reviews venue={v} lang={lang} />
            </section>

            <section id="career" className="ak-section">
              <h2 className="ak-section-h">{c.sections.career}</h2>
              <window.CareerLog venue={v} lang={lang} />
            </section>

            <section id="similar" className="ak-section">
              <h2 className="ak-section-h">{c.sections.similar}</h2>
              <window.SimilarList venue={v} lang={lang} />
            </section>

            <button style={{
              marginTop: 24, marginBottom: 8,
              background: 'transparent', border: '1px solid var(--border)',
              color: 'var(--text-secondary)', padding: '10px 16px',
              borderRadius: 999, fontFamily: 'inherit', fontSize: 13, cursor: 'pointer',
              display: 'inline-flex', alignItems: 'center', gap: 8,
            }}>⚠ {c.reportIssue}</button>
          </div>

          {/* Aside */}
          <aside className="ak-detail-aside">
            {/* Fighter info card */}
            <div style={asideCard}>
              <h3 style={asideH}>{lang === 'de' ? 'Kämpfer-Info' : 'Fighter Info'}</h3>
              {/* Record visual */}
              <div style={{
                display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 8, marginBottom: 16,
              }}>
                <div style={{
                  padding: '12px 8px', textAlign: 'center',
                  background: 'var(--win-bg)', border: '1px solid rgba(16,185,129,0.3)',
                  borderRadius: 8,
                }}>
                  <div style={{ fontSize: 28, fontWeight: 800, color: 'var(--win)', lineHeight: 1 }}>{wins}</div>
                  <div style={{ fontSize: 11, color: 'var(--win)', fontWeight: 600, marginTop: 2, letterSpacing: '0.05em', textTransform: 'uppercase' }}>
                    {lang === 'de' ? 'Siege' : 'Wins'}
                  </div>
                </div>
                <div style={{
                  padding: '12px 8px', textAlign: 'center',
                  background: 'var(--loss-bg)', border: '1px solid rgba(196,30,58,0.3)',
                  borderRadius: 8,
                }}>
                  <div style={{ fontSize: 28, fontWeight: 800, color: 'var(--loss)', lineHeight: 1 }}>{losses}</div>
                  <div style={{ fontSize: 11, color: 'var(--loss)', fontWeight: 600, marginTop: 2, letterSpacing: '0.05em', textTransform: 'uppercase' }}>
                    {lang === 'de' ? 'Niederlagen' : 'Losses'}
                  </div>
                </div>
              </div>

              <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
                {[
                  ['⚖️', lang === 'de' ? 'Klasse' : 'Class', v.weightClass],
                  ['🥊', lang === 'de' ? 'Stil' : 'Style', (v.styles || []).join(', ')],
                  ['📍', lang === 'de' ? 'Stadt' : 'City', v.city + ' ' + (v.country === 'Austria' ? '🇦🇹' : '🇩🇪')],
                  ['🏋️', lang === 'de' ? 'Gym' : 'Gym', v.stats?.gym || '—'],
                ].map(([icon, label, val]) => (
                  <div key={label} style={contactRow}>
                    <span style={{ color: 'var(--text-tertiary)', fontSize: 15, width: 22, flexShrink: 0 }}>{icon}</span>
                    <div style={{ flex: 1 }}>
                      <div style={{ fontSize: 10, fontWeight: 700, letterSpacing: '0.07em', textTransform: 'uppercase', color: 'var(--text-tertiary)' }}>{label}</div>
                      <div style={{ fontSize: 13, fontWeight: 600, color: 'var(--text-primary)', marginTop: 1 }}>{val}</div>
                    </div>
                  </div>
                ))}
              </div>
            </div>

            {/* Physical stats card */}
            {v.stats && (
              <div style={asideCard}>
                <h3 style={asideH}>{lang === 'de' ? 'Körpermaße' : 'Physical Stats'}</h3>
                <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 10 }}>
                  {[
                    [lang === 'de' ? 'Größe' : 'Height', v.stats.height],
                    [lang === 'de' ? 'Spannweite' : 'Reach',  v.stats.reach],
                    [lang === 'de' ? 'Haltung' : 'Stance',   v.stats.stance],
                    [lang === 'de' ? 'Alter' : 'Age',         v.stats.age ? v.stats.age + ' J.' : '—'],
                  ].map(([label, val]) => (
                    <div key={label} style={{
                      padding: '10px', textAlign: 'center',
                      background: 'var(--background)', borderRadius: 8,
                      border: '1px solid var(--border)',
                    }}>
                      <div style={{ fontSize: 15, fontWeight: 700, color: 'var(--accent)' }}>{val || '—'}</div>
                      <div style={{ fontSize: 10, color: 'var(--text-tertiary)', marginTop: 2, letterSpacing: '0.05em', textTransform: 'uppercase', fontWeight: 600 }}>{label}</div>
                    </div>
                  ))}
                </div>
              </div>
            )}
          </aside>
        </div>
      </main>

      {/* Sticky bottom CTA */}
      <div style={{
        position: 'fixed', bottom: 0, left: 0, right: 0, zIndex: 50,
        background: 'rgba(13,13,20,0.95)',
        backdropFilter: 'blur(12px)',
        borderTop: '1px solid var(--border)',
        padding: '12px 24px',
        display: 'flex', alignItems: 'center', justifyContent: 'space-between',
        maxWidth: '100%',
      }}>
        <div style={{ fontSize: 14, fontWeight: 700 }}>
          {v.name}
          <span style={{ fontSize: 12, fontWeight: 500, color: 'var(--text-secondary)', marginLeft: 8 }}>
            {v.weightClass}
          </span>
        </div>
        <div style={{ display: 'flex', gap: 8, alignItems: 'center' }}>
          <span style={{ fontSize: 14, fontWeight: 800 }}>
            <span style={{ color: 'var(--win)' }}>{wins}W</span>
            <span style={{ color: 'var(--text-tertiary)', fontWeight: 400, margin: '0 4px' }}>·</span>
            <span style={{ color: 'var(--loss)' }}>{losses}L</span>
          </span>
          <a href="FightFolio Homepage.html" style={btnStyle('ghost')}>
            ← {lang === 'de' ? 'Alle Kämpfer' : 'All fighters'}
          </a>
        </div>
      </div>
    </>
  );
}

function btnStyle(variant) {
  if (variant === 'accent') return {
    display: 'inline-flex', alignItems: 'center', gap: 6,
    background: 'var(--accent)', color: 'var(--text-on-accent)',
    border: 'none', borderRadius: 999,
    padding: '9px 18px', fontFamily: 'inherit', fontWeight: 700, fontSize: 13,
    cursor: 'pointer',
  };
  return {
    display: 'inline-flex', alignItems: 'center', gap: 6,
    background: 'transparent', color: 'var(--text-primary)',
    border: '1px solid var(--border)', borderRadius: 999,
    padding: '9px 18px', fontFamily: 'inherit', fontWeight: 600, fontSize: 13,
    cursor: 'pointer', textDecoration: 'none',
  };
}

const asideCard = {
  background: 'var(--card)',
  border: '1px solid var(--border)',
  borderRadius: 'var(--radius-card)',
  padding: 16,
};
const asideH = {
  margin: '0 0 14px', fontSize: 12, fontWeight: 700,
  letterSpacing: '0.08em', textTransform: 'uppercase',
  color: 'var(--text-tertiary)',
};
const contactRow = {
  display: 'flex', alignItems: 'flex-start', gap: 10,
  padding: '8px 0',
  borderBottom: '1px solid var(--border)',
};

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<Detail />);
</script>
</body>
</html>
