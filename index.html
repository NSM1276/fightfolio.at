<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FightFolio.at</title>
<script>
  // Smart router: main domain → homepage, fighter subdomain → detail page
  var h = window.location.hostname.toLowerCase();
  var parts = h.split('.');
  var isLocalhost = h === 'localhost' || h.startsWith('127.') || h === '';
  var isVercel = h.endsWith('.vercel.app');
  var isFighterSubdomain = !isLocalhost && !isVercel && parts.length >= 3 && parts[0] !== 'www';

  if (isFighterSubdomain) {
    // e.g. rakic.fightfolio.at → FightFolio Fighter Detail.html?id=rakic
    window.location.replace('FightFolio Fighter Detail.html?id=' + parts[0]);
  } else {
    window.location.replace('FightFolio Homepage.html');
  }
</script>
</head>
<body>
</body>
</html>
